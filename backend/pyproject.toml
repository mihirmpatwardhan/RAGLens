[project]
name = "raglense-backend"
version = "0.1.0"
description = "RAGLense - Enterprise-Grade Multimodal Knowledge Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RAGLense" }]

dependencies = [
    # Core Framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",

    # Cache & Queue
    "redis>=5.1.0",
    "celery[redis]>=5.4.0",

    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",

    # AI & ML
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "openai>=1.50.0",
    "anthropic>=0.34.0",
    "google-generativeai>=0.8.0",

    # Embeddings
    "sentence-transformers>=3.1.0",

    # Vector Stores
    "chromadb>=0.5.0",
    "faiss-cpu>=1.8.0",

    # Document Processing
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.4.0",

    # OCR
    "easyocr>=1.7.0",

    # NLP
    "langdetect>=1.0.9",
    "tiktoken>=0.7.0",
    "nltk>=3.9.0",

    # Utilities
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "python-slugify>=8.0.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
